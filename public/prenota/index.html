<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prenota una sede</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* I colori arrivano da Telegram: l'app deve sembrare parte dell'app che la
   ospita, e chi la usa col tema scuro non deve prendersi una pagina bianca in
   faccia. I fallback servono per quando si apre la pagina in un browser
   normale, tipo mentre la si sviluppa. */
:root {
  --sfondo: var(--tg-theme-bg-color, #17212b);
  --sfondo-scheda: var(--tg-theme-secondary-bg-color, #232e3c);
  --testo: var(--tg-theme-text-color, #f5f5f5);
  --tenue: var(--tg-theme-hint-color, #8a9aa9);
  --accento: var(--tg-theme-button-color, #4a9ee0);
  --su-accento: var(--tg-theme-button-text-color, #fff);
  --pericolo: #d9534f;
  --attenzione: #d9a441;
  --ok: #4caf7d;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 12px 12px 96px;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--sfondo);
  color: var(--testo);
  font-size: 16px;
  line-height: 1.4;
}

h1 { font-size: 1.15rem; margin: 0 0 2px; }
.sottotitolo { color: var(--tenue); font-size: .85rem; margin-bottom: 14px; }

.schede { display: flex; gap: 6px; margin-bottom: 14px; }
.schede button {
  flex: 1; padding: 9px 4px; border: 0; border-radius: 10px;
  background: var(--sfondo-scheda); color: var(--tenue);
  font: inherit; font-size: .9rem; cursor: pointer;
}
.schede button[aria-selected="true"] { background: var(--accento); color: var(--su-accento); }

.pannello[hidden] { display: none; }

.campo { margin-bottom: 14px; }
.campo > label { display: block; font-size: .82rem; color: var(--tenue); margin-bottom: 6px; }

.scelte { display: flex; gap: 8px; flex-wrap: wrap; }
.scelte button {
  flex: 1 1 40%; padding: 12px 8px; border: 2px solid transparent; border-radius: 12px;
  background: var(--sfondo-scheda); color: var(--testo); font: inherit; cursor: pointer;
}
.scelte button[aria-pressed="true"] { border-color: var(--accento); }

input[type="date"], input[type="text"], select, textarea {
  width: 100%; padding: 11px; border: 0; border-radius: 10px;
  background: var(--sfondo-scheda); color: var(--testo); font: inherit;
}
textarea { resize: vertical; min-height: 64px; }

.orari { display: flex; gap: 8px; align-items: center; }
.orari select { flex: 1; }
.orari span { color: var(--tenue); }

.interruttore {
  display: flex; align-items: center; gap: 10px;
  background: var(--sfondo-scheda); padding: 12px; border-radius: 12px;
}
.interruttore input { width: 20px; height: 20px; accent-color: var(--accento); }
.interruttore div { flex: 1; }
.interruttore small { display: block; color: var(--tenue); font-size: .78rem; }

.avviso {
  border-radius: 12px; padding: 11px 12px; margin-bottom: 12px; font-size: .88rem;
  background: var(--sfondo-scheda); border-left: 4px solid var(--tenue);
}
.avviso.ok { border-left-color: var(--ok); }
.avviso.attenzione { border-left-color: var(--attenzione); }
.avviso.pericolo { border-left-color: var(--pericolo); }
.avviso b { display: block; margin-bottom: 2px; }

.riga {
  background: var(--sfondo-scheda); border-radius: 12px; padding: 12px;
  margin-bottom: 10px;
}
.riga .quando { color: var(--tenue); font-size: .84rem; }
.riga button {
  margin-top: 8px; padding: 8px 12px; border: 0; border-radius: 9px;
  background: transparent; color: var(--pericolo); font: inherit; font-size: .85rem;
  cursor: pointer; border: 1px solid var(--pericolo);
}
.vuoto { color: var(--tenue); text-align: center; padding: 28px 8px; }
</style>
</head>
<body>

<h1>Prenota una sede</h1>
<div class="sottotitolo" id="saluto">…</div>

<div class="schede" role="tablist">
  <button role="tab" id="tab-prenota" aria-selected="true">Prenota</button>
  <button role="tab" id="tab-mie" aria-selected="false">Le mie</button>
  <button role="tab" id="tab-staff" aria-selected="false" hidden>Staff</button>
</div>

<!-- ---------------------------------------------------------- prenota -->
<section class="pannello" id="pannello-prenota">
  <div id="blocco-avvisi"></div>

  <div class="campo">
    <label>Sede</label>
    <div class="scelte" id="sedi"></div>
  </div>

  <div class="campo">
    <label for="data">Giorno</label>
    <input type="date" id="data">
  </div>

  <div class="campo">
    <label>Orario</label>
    <div class="orari">
      <select id="ora-inizio"></select>
      <span>→</span>
      <select id="ora-fine"></select>
    </div>
  </div>

  <div class="campo">
    <label for="titolo">Cosa ci fai</label>
    <input type="text" id="titolo" maxlength="80" placeholder="Serata di gioco, riunione, prova…">
  </div>

  <div class="campo">
    <label for="note">Note (facoltative)</label>
    <textarea id="note" maxlength="400" placeholder="Quante persone, cosa serve…"></textarea>
  </div>

  <div class="campo">
    <div class="interruttore">
      <input type="checkbox" id="apertura">
      <div>
        <label for="apertura" style="margin:0;color:var(--testo)">Serve che qualcuno apra</label>
        <small>Avviso io lo staff della sede</small>
      </div>
    </div>
  </div>
</section>

<!-- ------------------------------------------------------------- mie -->
<section class="pannello" id="pannello-mie" hidden>
  <div id="elenco-mie" class="vuoto">…</div>
</section>

<!-- ----------------------------------------------------------- staff -->
<section class="pannello" id="pannello-staff" hidden>
  <div class="campo">
    <label for="blocca-id">Sospendi le prenotazioni di qualcuno</label>
    <input type="text" id="blocca-id" inputmode="numeric" placeholder="user id (si legge con /info)">
  </div>
  <div class="campo">
    <button id="blocca-vai" style="width:100%;padding:12px;border:0;border-radius:12px;background:var(--pericolo);color:#fff;font:inherit">
      Sospendi
    </button>
  </div>
  <div id="elenco-bloccati"></div>
</section>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const stato = { sede: null, limiti: null, staff: false, bloccato: false, controllo: null };

function elemento(id) { return document.getElementById(id); }

async function chiama(percorso, dati = {}) {
  const risposta = await fetch(`/prenota/api/${percorso}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...dati, initData: tg?.initData || '' }),
  });
  const esito = await risposta.json().catch(() => ({ errore: 'risposta illeggibile' }));
  if (!risposta.ok) throw new Error(esito.errore || `errore ${risposta.status}`);
  return esito;
}

function avviso(tipo, titolo, testo) {
  return `<div class="avviso ${tipo}"><b>${titolo}</b>${testo || ''}</div>`;
}

// ---------------------------------------------------------------- orari
function riempiOrari(min, max) {
  const inizio = elemento('ora-inizio');
  const fine = elemento('ora-fine');
  // Mezz'ore: "dalle 18 alle 20:30" e' una richiesta normale, obbligare all'ora
  // piena farebbe prenotare mezz'ora in piu' a tutti.
  for (let h = min; h < max; h += 0.5) inizio.add(new Option(etichettaOra(h), h));
  for (let h = min + 0.5; h <= max; h += 0.5) fine.add(new Option(etichettaOra(h), h));
  inizio.value = 18;
  fine.value = 21;
}

function etichettaOra(h) {
  const ore = Math.floor(h);
  const minuti = h % 1 ? '30' : '00';
  return `${String(ore).padStart(2, '0')}:${minuti}`;
}

// ------------------------------------------------------- disponibilita
let attesa = null;
function controllaTraPoco() {
  clearTimeout(attesa);
  attesa = setTimeout(controlla, 250);
}

async function controlla() {
  const blocco = elemento('blocco-avvisi');
  if (!stato.sede || !elemento('data').value) {
    blocco.innerHTML = avviso('', 'Scegli sede e giorno', '');
    aggiornaBottone(false);
    return;
  }

  blocco.innerHTML = avviso('', 'Controllo…', '');
  let esito;
  try {
    esito = await chiama('disponibilita', {
      sede: stato.sede,
      data: elemento('data').value,
      oraInizio: elemento('ora-inizio').value,
      oraFine: elemento('ora-fine').value,
    });
  } catch (err) {
    blocco.innerHTML = avviso('pericolo', 'Non riesco a controllare', err.message);
    aggiornaBottone(false);
    return;
  }

  stato.controllo = esito;
  const pezzi = [];
  let prenotabile = true;

  if (!esito.ok) {
    pezzi.push(avviso('pericolo', 'Non va bene', esito.guai.join('; ')));
    prenotabile = false;
  } else if (esito.pieno) {
    pezzi.push(avviso('pericolo', 'Slot pieno',
      `Ci sono gia ${esito.occupati} attivita in quelle ore, ed e il massimo. Prova un altro orario.`));
    prenotabile = false;
  } else if (esito.secondo) {
    const altri = esito.eventi.map(e => e.nome).join(', ');
    pezzi.push(avviso('attenzione', 'Sarai il secondo',
      `In quelle ore c'e gia: ${altri}. Si puo, la sala regge due attivita insieme, ma avvisa l'altro gruppo.`));
  } else {
    pezzi.push(avviso('ok', 'Libero', 'In quelle ore non c\'e nessun altro.'));
  }

  if (esito.limiteSettimanale) {
    pezzi.push(avviso('pericolo', 'Hai finito le prenotazioni della settimana',
      `Sono ${stato.limiti.maxASettimana} a settimana e ne hai gia ${esito.questaSettimana}.`));
    prenotabile = false;
  } else if (esito.questaSettimana > 0) {
    pezzi.push(avviso('', 'Nota',
      `In quella settimana hai gia ${esito.questaSettimana} prenotazione/i su ${stato.limiti.maxASettimana}.`));
  }

  blocco.innerHTML = pezzi.join('');
  aggiornaBottone(prenotabile && !stato.bloccato);
}

function aggiornaBottone(attivo) {
  if (!tg?.MainButton) return;
  const suPrenota = !elemento('pannello-prenota').hidden;
  if (!suPrenota) { tg.MainButton.hide(); return; }
  tg.MainButton.setText('Prenota');
  tg.MainButton.show();
  attivo ? tg.MainButton.enable() : tg.MainButton.disable();
}

// ------------------------------------------------------------ prenota
async function prenota() {
  const titolo = elemento('titolo').value.trim();
  if (!titolo) {
    tg?.showAlert('Scrivi cosa ci fai: allo staff serve per sapere chi c\'e in sala.');
    return;
  }
  tg?.MainButton.showProgress();
  try {
    const esito = await chiama('prenota', {
      sede: stato.sede,
      data: elemento('data').value,
      oraInizio: elemento('ora-inizio').value,
      oraFine: elemento('ora-fine').value,
      titolo,
      note: elemento('note').value.trim(),
      serveApertura: elemento('apertura').checked,
    });
    const righe = ['Prenotato.'];
    if (esito.secondo) righe.push('Sei il secondo in quelle ore: avvisa l\'altro gruppo.');
    if (esito.avvisoStaff) righe.push(esito.avvisoStaff);
    else if (elemento('apertura').checked) righe.push('Ho avvisato lo staff della sede.');
    tg?.HapticFeedback?.notificationOccurred('success');
    tg?.showPopup?.({ title: 'Fatto', message: righe.join('\n'), buttons: [{ type: 'ok' }] });
    elemento('titolo').value = '';
    elemento('note').value = '';
    elemento('apertura').checked = false;
    controlla();
    caricaMie();
  } catch (err) {
    tg?.showAlert(err.message);
  } finally {
    tg?.MainButton.hideProgress();
  }
}

// --------------------------------------------------------------- mie
async function caricaMie() {
  const dove = elemento('elenco-mie');
  dove.className = 'vuoto';
  dove.textContent = 'Carico…';
  try {
    const { prenotazioni } = await chiama('mie');
    if (!prenotazioni.length) {
      dove.textContent = 'Non hai prenotazioni in arrivo.';
      return;
    }
    dove.className = '';
    dove.innerHTML = prenotazioni.map(p => `
      <div class="riga">
        <div>${p.nome || 'senza titolo'}</div>
        <div class="quando">${formatta(p.inizio, p.fine)} · ${p.sede}</div>
        <button data-sede="${p.sede}" data-id="${p.id}">Annulla</button>
      </div>`).join('');
    dove.querySelectorAll('button').forEach(b => b.onclick = () => annulla(b.dataset.sede, b.dataset.id));
  } catch (err) {
    dove.textContent = err.message;
  }
}

function formatta(inizio, fine) {
  const a = new Date(inizio), b = new Date(fine);
  const giorno = a.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
  const ora = (d) => d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
  return `${giorno}, ${ora(a)}-${ora(b)}`;
}

function annulla(sede, id) {
  const fai = async () => {
    try {
      await chiama('annulla', { sede, eventId: id });
      caricaMie();
    } catch (err) { tg?.showAlert(err.message); }
  };
  if (tg?.showConfirm) tg.showConfirm('Annullo questa prenotazione?', (si) => si && fai());
  else fai();
}

// ------------------------------------------------------------- staff
async function caricaBloccati() {
  try {
    const { bloccati } = await chiama('bloccati');
    elemento('elenco-bloccati').innerHTML = bloccati.length
      ? bloccati.map(b => `
          <div class="riga">
            <div>${b.nome || b.id}</div>
            <div class="quando">id ${b.id} · sospeso da ${b.daChi}</div>
            <button data-id="${b.id}">Riattiva</button>
          </div>`).join('')
      : '<div class="vuoto">Nessuno sospeso.</div>';
    elemento('elenco-bloccati').querySelectorAll('button').forEach(b => {
      b.onclick = async () => {
        await chiama('blocca', { userId: b.dataset.id, sblocca: true });
        caricaBloccati();
      };
    });
  } catch (err) {
    elemento('elenco-bloccati').innerHTML = `<div class="vuoto">${err.message}</div>`;
  }
}

// -------------------------------------------------------------- avvio
function mostra(quale) {
  for (const nome of ['prenota', 'mie', 'staff']) {
    elemento(`pannello-${nome}`).hidden = nome !== quale;
    elemento(`tab-${nome}`).setAttribute('aria-selected', String(nome === quale));
  }
  if (quale === 'mie') caricaMie();
  if (quale === 'staff') caricaBloccati();
  aggiornaBottone(Boolean(stato.controllo && !stato.controllo.pieno));
}

async function avvia() {
  let info;
  try {
    info = await chiama('stato');
  } catch (err) {
    document.body.innerHTML = `<div class="vuoto">${err.message}</div>`;
    return;
  }

  stato.limiti = info.limiti;
  stato.staff = info.staff;
  stato.bloccato = info.bloccato;

  elemento('saluto').textContent = info.bloccato
    ? 'Le tue prenotazioni sono sospese dallo staff.'
    : `Ciao ${info.utente.nome}. Massimo ${info.limiti.maxASettimana} prenotazioni a settimana.`;

  elemento('sedi').innerHTML = info.sedi.map(s =>
    `<button data-slug="${s.slug}" aria-pressed="false">${s.nome}</button>`).join('');
  elemento('sedi').querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      stato.sede = b.dataset.slug;
      elemento('sedi').querySelectorAll('button').forEach(x =>
        x.setAttribute('aria-pressed', String(x === b)));
      controllaTraPoco();
    };
  });

  const oggi = new Date();
  const fra = new Date(oggi.getTime() + info.limiti.giorniAvanti * 86400000);
  const iso = (d) => d.toISOString().slice(0, 10);
  elemento('data').min = iso(oggi);
  elemento('data').max = iso(fra);
  elemento('data').value = iso(oggi);

  riempiOrari(info.limiti.oraMinima, info.limiti.oraMassima);

  if (info.staff) elemento('tab-staff').hidden = false;

  ['data', 'ora-inizio', 'ora-fine'].forEach(id =>
    elemento(id).addEventListener('change', controllaTraPoco));
  elemento('tab-prenota').onclick = () => mostra('prenota');
  elemento('tab-mie').onclick = () => mostra('mie');
  elemento('tab-staff').onclick = () => mostra('staff');
  elemento('blocca-vai').onclick = async () => {
    const id = elemento('blocca-id').value.trim();
    if (!id) return;
    try {
      await chiama('blocca', { userId: id });
      elemento('blocca-id').value = '';
      caricaBloccati();
    } catch (err) { tg?.showAlert(err.message); }
  };

  tg?.MainButton.onClick(prenota);
  controlla();
}

avvia();
</script>
</body>
</html>
